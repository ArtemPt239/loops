[project]
name = "loops"
version = "0.1.0"
description = "Searching for a model organism of sneaky reward hacking on coding tasks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "evalplus>=0.3.1",
    "matplotlib>=3.10.9",
    "openai>=3.46.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loops"]

[tool.ruff]
line-length = 110
